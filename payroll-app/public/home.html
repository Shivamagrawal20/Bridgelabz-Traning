<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Payroll Form</title>
<link rel="stylesheet" href="payroll-app/public/style.css">
</head>

<body>
<div class="header">
    EMPLOYEE <span>PAYROLL</span>
</div>

<div class="container">
    <h2>Employee Payroll Form</h2>

    <form>
        <div class="form-row">
            <label>Name</label>
            <input type="text" placeholder="Enter name">
        </div>
        <div class="form-row">
            <label>Profile image</label>
            <div class="profile-options">
                <label>
                    <input type="radio" name="profile">
                    <img src="https://randomuser.me/api/portraits/women/1.jpg">
                </label>
                <label>
                    <input type="radio" name="profile">
                    <img src="https://randomuser.me/api/portraits/women/2.jpg">
                </label>
                <label>
                    <input type="radio" name="profile">
                    <img src="https://randomuser.me/api/portraits/women/3.jpg">
                </label>
                <label>
                    <input type="radio" name="profile">
                    <img src="https://randomuser.me/api/portraits/men/4.jpg">
                </label>
            </div>
        </div>

        <!-- Gender -->
        <div class="form-row">
            <label>Gender</label>
            <div class="inline-options">
                <label><input type="radio" name="gender"> Male</label>
                <label><input type="radio" name="gender"> Female</label>
            </div>
        </div>
        <div class="form-row">
            <label>Department</label>
            <div class="inline-options">
                <label><input type="checkbox"> HR</label>
                <label><input type="checkbox"> Sales</label>
                <label><input type="checkbox"> Finance</label>
                <label><input type="checkbox"> Engineer</label>
                <label><input type="checkbox"> Others</label>
            </div>
        </div>

        <div class="form-row">
            <label>Salary</label>
            <select>
                <option>Select Salary</option>
                <option>30000</option>
                <option>40000</option>
                <option>50000</option>
                <option>60000</option>
            </select>
        </div>

        <div class="form-row">
            <label>Start Date</label>
            <div class="date-group">
                <select>
                    <option>Day</option>
                </select>
                <select>
                    <option>Month</option>
                </select>
                <select>
                    <option>Year</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <label>Notes</label>
            <textarea rows="4"></textarea>
        </div>

        <div class="button-row">
            <button type="button" class="cancel-btn">Cancel</button>
            <div class="right-buttons">
                <button type="submit" class="submit-btn">Submit</button>
                <button type="reset" class="reset-btn">Reset</button>
            </div>
        </div>

    </form>
</div>

</body>
</html>
